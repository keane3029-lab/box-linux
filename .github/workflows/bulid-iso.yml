name: Build Debian ISO

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Add your existing ISO build steps here

      - name: Publish to Releases (Placeholder / Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Box Linux (Latest Build)
          body: "Automated build from main."
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            *.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
