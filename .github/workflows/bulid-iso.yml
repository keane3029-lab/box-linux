name: Build Debian ISO

on:
  push:
    branches: [ master ]
  workflow_dispatch: # Enable manual triggers via gh CLI and GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install live-build and dependencies
        run: |
          apt-get update
          apt-get install -y live-build debootstrap syslinux-utils xorriso squashfs-tools sudo

      - name: Build ISO
        run: |
          lb clean
          lb config
          lb build

      - name: Rename ISO for clarity
        run: |
          mv *.hybrid.iso box-linux.iso || mv live-image-*.iso box-linux.iso || true

      - name: Upload ISO as Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: box-linux-iso
          path: box-linux.iso
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download ISO Artifact
        uses: actions/download-artifact@v4
        with:
          name: box-linux-iso

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Box Linux (Latest Build)
          body: "Automated build from master branch."
          draft: false
          prerelease: false
          make_latest: "true"
          files: box-linux.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
