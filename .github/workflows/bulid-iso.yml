name: Build Debian ISO

on:
  push:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install live-build and dependencies
        run: |
          apt-get update
          apt-get install -y live-build debootstrap syslinux-utils xorriso squashfs-tools sudo

      - name: Build ISO
        run: |
          lb clean
          lb config
          lb build

      - name: Rename ISO for clarity
        run: |
          mv *.hybrid.iso box-linux.iso || mv live-image-*.iso box-linux.iso || true

      - name: Publish to Releases (Placeholder / Latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Box Linux (Latest Build)
          body: "Automated build from main."
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            *.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
